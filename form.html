<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Обратная связь — Модульный проект</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <img src="logo.png" alt="Логотип колледжа" class="logo">
        <h1>Колледж информационных технологий</h1>
        <nav class="nav">
            <a href="index.html">Главная</a>
            <a href="about.html">О колледже</a>
            <a href="form.html">Обратная связь</a>
        </nav>
    </header>

    <main class="main">

        <section class="form-section">
            <h1>Форма обратной связи</h1>
            <p>Заполните форму ниже, и мы свяжемся с вами в ближайшее время.</p>

            <form class="contact-form" action="#" method="POST">

                <div class="form-group">
                    <label for="name">Ваше имя *</label>
                    <input type="text" id="name" name="name" placeholder="Иван Иванов" required>
                </div>

                <div class="form-group">
                    <label for="email">Email *</label>
                    <input type="email" id="email" name="email" placeholder="example@mail.ru" required>
                </div>

                <div class="form-group">
                    <label for="topic">Тема обращения *</label>
                    <select id="topic" name="topic" required>
                        <option value="">— Выберите тему —</option>
                        <option value="admission">Поступление</option>
                        <option value="study">Учебный процесс</option>
                        <option value="technical">Техническая проблема</option>
                        <option value="other">Другое</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="message">Сообщение *</label>
                    <textarea id="message" name="message" rows="6" placeholder="Опишите ваш вопрос..." required></textarea>
                </div>

                <div class="form-group checkbox-group">
                    <input type="checkbox" id="agree" name="agree" required>
                    <label for="agree">Я согласен на обработку персональных данных *</label>
                </div>

                <button type="submit" class="btn">Отправить</button>

            </form>
        </section>

    </main>

    <footer class="footer">
        <p>© 2026 Колледж информационных технологий</p>
    </footer>

</body>
</html>
